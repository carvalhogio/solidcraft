name: SolidCraft - Instalador Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  instalador-windows:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Baixar codigo corrigido do seu GitHub
        uses: actions/checkout@v4

      - name: Preparar compilador Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Compilar aplicativo com as correcoes atuais
        shell: pwsh
        run: cargo build --release --locked -p solidcraft

      - name: Verificar executavel e icone originais
        shell: pwsh
        run: |
          if (!(Test-Path 'target/release/solidcraft.exe')) { throw 'solidcraft.exe nao foi criado' }
          if (!(Test-Path 'assets/icons/app/windows/exports/solidcraft.ico')) { throw 'icone original ausente' }
          if (!(Test-Path 'packaging/custom/solidcraft-custom.iss')) { throw 'arquivo do instalador ausente' }

      - name: Instalar gerador do instalador Windows
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Gerar instalador EXE com atalho na area de trabalho
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) { $iscc = 'C:\Program Files\Inno Setup 6\ISCC.exe' }
          if (!(Test-Path $iscc)) { throw 'Compilador Inno Setup nao localizado' }
          & $iscc 'packaging/custom/solidcraft-custom.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup falhou: $LASTEXITCODE" }

      - name: Conferir instalador pronto
        shell: pwsh
        run: |
          $p = 'dist/SolidCraft-Windows-Instalador.exe'
          if (!(Test-Path $p)) { throw 'Instalador nao encontrado' }
          Get-FileHash $p -Algorithm SHA256 | Format-List

      - name: Disponibilizar instalador para baixar
        uses: actions/upload-artifact@v4
        with:
          name: SolidCraft-Windows-Instalador
          path: dist/SolidCraft-Windows-Instalador.exe
          if-no-files-found: error
          retention-days: 14
